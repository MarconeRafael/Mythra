[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mythra"
version = "0.1.0"
description = "Persistent narrative state foundation for Mythra."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"alembic>=1.13,<2.0",
	"email-validator>=2.2,<3.0",
	"fastapi>=0.115,<1.0",
	"psycopg[binary]>=3.2,<4.0",
	"pydantic>=2.9,<3.0",
	"pydantic-settings>=2.5,<3.0",
	"sqlalchemy>=2.0,<3.0",
	"uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
	"httpx>=0.27,<1.0",
	"mypy>=1.11,<2.0",
	"pytest>=8.3,<9.0",
	"ruff>=0.6,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
